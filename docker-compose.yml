services:

  db:
    image: postgres:16
    container_name: incident-postgres
    environment:
      POSTGRES_DB: incidentdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d incidentdb" ]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    container_name: incident-correlator
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/incidentdb
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=admin123
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - SPRING_JPA_DATABASE_PLATFORM=org.hibernate.dialect.PostgreSQLDialect
      - JWT_SECRET=dGVzdC1zZWNyZXQta2V5LWZvci1jaS1vbmx5LTEyMzQ1Njc4OTA=
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

volumes:
  postgres_data: